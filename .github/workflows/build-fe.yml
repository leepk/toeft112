name: Build Frontend Docker

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create Frontend Env
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > ./.env

      - name: Build Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/toeft112-web:latest \
            .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/toeft112-web:latest

      - name: Deploy To Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/toeft112-web:latest
            docker compose -p acuherb-web -f /opt/english/frontend-compose.yml down
            docker image prune -f
            docker compose -p acuherb-web -f /opt/english/frontend-compose.yml up -d
